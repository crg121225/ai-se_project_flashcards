<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Chelsea Gallagher" />
    <meta
      name="description"
      content="A flashcard carousel website for practicing concepts, reviewing key ideas, and improving study sessions."
    />
    <meta
      name="keywords"
      content="study aids, flashcards, learning materials, quiz practice, revision"
    />
    <title>Flashcard Carousel</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/x-icon" href="./favicon.ico" />
    <link rel="stylesheet" href="./assets/vendor/normalize.css" />
    <link rel="stylesheet" href="./assets/css/style.css" />
  </head>
  <body class="page">
    <header class="header">
      <h1 class="header__title">
        <a class="header__link" href="./index.html">Flash Cards</a>
      </h1>
      <nav class="nav">
        <ul class="nav__links">
          <li><a class="nav__link" href="./index.html">Decks</a></li>
          <li><a class="nav__link" href="./carousel.html">Review</a></li>
        </ul>
      </nav>
    </header>
    <main class="page__main-content">
      <section class="decks">
        <h2 class="decks__title">My Decks</h2>
        <ul class="decks__list">
          <li class="deck deck_color_green">
            <h3 class="deck__title">HTML Basics</h3>
            <div class="deck__row">
              <p class="deck__count">12 cards</p>
              <button
                class="deck__delete-btn"
                type="button"
                aria-label="Delete this deck"
              >
                <img src="./assets/images/delete.svg" alt="" />
              </button>
            </div>
          </li>
          <li class="deck deck_color_blue">
            <h3 class="deck__title">CSS Layout</h3>
            <div class="deck__row">
              <p class="deck__count">9 cards</p>
              <button
                class="deck__delete-btn"
                type="button"
                aria-label="Delete this deck"
              >
                <img src="./assets/images/delete.svg" alt="" />
              </button>
            </div>
          </li>
          <li class="deck deck_color_pink">
            <h3 class="deck__title">JavaScript Intro</h3>
            <div class="deck__row">
              <p class="deck__count">15 cards</p>
              <button
                class="deck__delete-btn"
                type="button"
                aria-label="Delete this deck"
              >
                <img src="./assets/images/delete.svg" alt="" />
              </button>
            </div>
          </li>
          <li class="deck deck_color_purple">
            <h3 class="deck__title">Accessibility</h3>
            <div class="deck__row">
              <p class="deck__count">7 cards</p>
              <button
                class="deck__delete-btn"
                type="button"
                aria-label="Delete this deck"
              >
                <img src="./assets/images/delete.svg" alt="" />
              </button>
            </div>
          </li>
          <li class="deck deck_color_orange">
            <h3 class="deck__title">Web APIs</h3>
            <div class="deck__row">
              <p class="deck__count">10 cards</p>
              <button
                class="deck__delete-btn"
                type="button"
                aria-label="Delete this deck"
              >
                <img src="./assets/images/delete.svg" alt="" />
              </button>
            </div>
          </li>
          <li class="deck deck_color_yellow">
            <h3 class="deck__title">HTTP & APIs</h3>
            <div class="deck__row">
              <p class="deck__count">11 cards</p>
              <button
                class="deck__delete-btn"
                type="button"
                aria-label="Delete this deck"
              >
                <img src="./assets/images/delete.svg" alt="" />
              </button>
            </div>
          </li>
        </ul>
        <button class="decks__new-deck-btn" type="button">+ New Deck</button>
      </section>
    </main>
    <footer class="footer">
      <p class="footer__text">&copy; 2026 Flash Cards</p>
    </footer>
  </body>
</html>
