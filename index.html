<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Chelsea Gallagher" />
    <meta
      name="description"
      content="A flashcard carousel website for practicing concepts, reviewing key ideas, and improving study sessions."
    />
    <meta
      name="keywords"
      content="study aids, flashcards, learning materials, quiz practice, revision"
    />
    <title>Flashcard Carousel</title>
    <link rel="icon" type="image/x-icon" href="./favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./assets/css/index.css" />
  </head>
  <body class="page">
    <header class="header">
      <h1 class="header__title">
        <a class="header__link" href="#home">Flash Cards</a>
      </h1>
      <nav class="nav">
        <ul class="nav__links">
          <li><a class="nav__link" href="#home">My Decks</a></li>
          <li><a class="nav__link" href="#about">About</a></li>
        </ul>
      </nav>
    </header>
    <main class="page__main-content">
      <section class="gallery" id="home">
        <h2 class="gallery__title">My Decks</h2>
        <p class="gallery__page-color">
          <span class="gallery__page-color-swatch" aria-hidden="true"></span>
          #ECECEC
        </p>
        <ul class="gallery__list"></ul>
        <button class="gallery__new-card-btn" type="button">+ New Deck</button>
      </section>
      <section class="gallery" id="deck-view" style="display: none;">
        <div class="gallery__header">
          <div class="gallery__title-row">
            <h2 class="gallery__title"></h2>
            <div class="gallery__actions">
              <button class="gallery__practice-btn" type="button">Practice</button>
            </div>
          </div>
        </div>
        <div class="wrapping-row">
          <ul class="gallery__list wrapping-row__display-contents"></ul>
          <button class="gallery__new-card-btn" type="button">+ New Card</button>
        </div>
      </section>
      <section class="carousel" id="carousel" style="display: none;">
        <h2 class="carousel__title"></h2>
        <div class="carousel__card card card__carousel_color_green">
          <p class="card__text"></p>
          <button class="carousel__flip-btn" type="button" aria-label="Flip card">
            <img src="./assets/images/flip.svg" alt="" />
          </button>
        </div>
        <div class="carousel__controls">
          <button class="carousel__nav-btn carousel__nav-btn_left" type="button" aria-label="Previous card">
            <img src="./assets/images/left.svg" alt="" />
          </button>
          <p class="carousel__counter"></p>
          <button class="carousel__nav-btn carousel__nav-btn_right" type="button" aria-label="Next card">
            <img src="./assets/images/right.svg" alt="" />
          </button>
        </div>
      </section>
      <section class="not-found" id="not-found" style="display: none;">
        <h2>404 Not Found</h2>
        <p>The page you're looking for doesn't exist.</p>
      </section>
      <section class="about" id="about" style="display: none;">
        <h2 class="about__title">About</h2>
        <p class="about__text">
          Flash Cards is a simple study tool for building decks and reviewing concepts with a clean, focused carousel.
        </p>
      </section>
    </main>
    <template id="deck-template">
      <li class="card card_color_green">
        <a class="card__link" href="#"></a>
        <h3 class="card__title"></h3>
        <p class="card__color-label">
          <span class="card__color-swatch" aria-hidden="true"></span>
          <span class="card__color-text"></span>
        </p>
        <div class="card__row">
          <p class="card__count"></p>
          <button
            class="card__delete-btn"
            type="button"
            aria-label="Delete this deck"
          >
            <img src="./assets/images/delete.svg" alt="" />
          </button>
        </div>
      </li>
    </template>
    <template id="card-template">
      <li class="card">
        <p class="card__text"></p>
        <div class="card__button-row">
          <button class="card__flip-btn" type="button" aria-label="Flip card">
            <img src="./assets/images/flip.svg" alt="" />
          </button>
          <button class="card__delete-btn" type="button" aria-label="Delete card">
            <img src="./assets/images/delete.svg" alt="" />
          </button>
        </div>
      </li>
    </template>
    <footer class="footer">
      <p class="footer__text">&copy; 2026 Chelsea Gallagher</p>
    </footer>
    <script type="module" src="./assets/js/index.js"></script>
  </body>
</html>
